---
package-name: apache-airflow-providers-arenadata-duckdb
name: Arenadata DuckDB
description: |
    `DuckDB <https://duckdb.org/>`__ provider by Arenadata.

    Runs DuckDB SQL through the DuckDB CLI (or ADO wrapper) with:

    - ``DuckDbOperator`` for SQL execution from DAGs
    - ``DuckDbSqlSensor`` for waiting on truthy query results
    - ``DuckDbHook`` and a ``duckdb`` Connection type

state: ready
lifecycle: production
source-date-epoch: 1768557443
# note that those versions are maintained by release manager - do not update them manually
versions:
  - 1.0.0

dependencies:
  - apache-airflow>=3.0.0

integrations:
  - integration-name: DuckDB
    external-doc-url: https://duckdb.org/
    how-to-guide:
      - /docs/apache-airflow-providers-arenadata-duckdb/operators.rst
      - /docs/apache-airflow-providers-arenadata-duckdb/sensors.rst
      - /docs/apache-airflow-providers-arenadata-duckdb/connections.rst
    tags: [database]

hooks:
  - integration-name: DuckDB
    python-modules:
      - airflow.providers.arenadata.duckdb.hooks.duckdb

operators:
  - integration-name: DuckDB
    python-modules:
      - airflow.providers.arenadata.duckdb.operators.duckdb

sensors:
  - integration-name: DuckDB
    python-modules:
      - airflow.providers.arenadata.duckdb.sensors.duckdb

connection-types:
  - hook-class-name: airflow.providers.arenadata.duckdb.hooks.duckdb.DuckDbHook
    connection-type: duckdb

example-dags:
  - airflow.providers.arenadata.duckdb.example_dags.example_duckdb_basic
  - airflow.providers.arenadata.duckdb.example_dags.example_duckdb_sql_file
  - airflow.providers.arenadata.duckdb.example_dags.example_duckdb_sensors
