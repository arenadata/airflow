---
# DuckDB integration for provider tests
# CLI is cached on the host-mounted /files/bin (survives `down --volumes`)
# Do NOT override PATH here — CI image needs /usr/python/bin for pytest
services:
  duckdb-fetch:
    image: alpine:3.20
    # No fixed container_name — breeze shell (project breeze) and
    # providers-integration-tests (airflow-test) must not collide
    labels:
      breeze.description: "Integration required for DuckDB hooks, operators and sensors (CLI 1.5.3)."
    environment:
      - DUCKDB_VERSION=1.5.3
      - DEST_DIR=/files/bin
    volumes:
      - ../../../files:/files
      - ./duckdb/fetch-duckdb-cli.sh:/opt/duckdb-fetch/fetch-duckdb-cli.sh:ro
    # One-shot: install curl/unzip, then fetch CLI if missing
    # No restart - failed fetch must fail the compose run
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache curl unzip >/dev/null
        exec /bin/sh /opt/duckdb-fetch/fetch-duckdb-cli.sh

  airflow:
    environment:
      - INTEGRATION_DUCKDB=true
      - DUCKDB_BINARY=/files/bin/duckdb
    depends_on:
      duckdb-fetch:
        condition: service_completed_successfully
