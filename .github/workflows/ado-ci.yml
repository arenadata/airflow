---
# Narrow CI for the Arenadata fork. Runs ruff (duckdb/ozone) and unit tests via uv.
# Does not use Breeze, GHCR, canary, Helm, or the full Apache test matrix.
name: Arenadata CI
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - '*-develop'
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'providers/arenadata/**'
      - '.github/workflows/ado-ci.yml'
  push:
    branches:
      - '*-develop'
    paths:
      - 'providers/arenadata/**'
      - '.github/workflows/ado-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ado-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff-check:
    name: "Ruff check (duckdb, ozone)"
    if: github.repository_owner != 'apache'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: "Run ruff check"
        run: >
          uv tool run --from ruff==0.15.10 ruff check
          providers/arenadata/duckdb
          providers/arenadata/ozone

  unit-tests:
    name: "Unit tests (${{ matrix.provider }})"
    if: github.repository_owner != 'apache'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        provider: [duckdb, hbase, ozone]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: "Install SASL build deps"
        if: matrix.provider == 'hbase'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev

      - name: "Install uv"
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: "Run unit tests"
        run: >
          uv run --project "providers/arenadata/${{ matrix.provider }}"
          pytest "providers/arenadata/${{ matrix.provider }}/tests/unit"
          -q --color=yes
