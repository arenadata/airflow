---
# Narrow CI for the Arenadata fork. Runs ruff (duckdb/ozone required, hbase non-blocking)
# and unit tests via uv. Does not use Breeze, GHCR, canary, Helm, or the full Apache test matrix
name: Arenadata CI
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - '*-develop'
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'providers/arenadata/**'
      - '.github/workflows/ado-ci.yml'
  push:
    branches:
      - '*-develop'
    paths:
      - 'providers/arenadata/**'
      - '.github/workflows/ado-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ado-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff-check:
    name: "Ruff check (duckdb, ozone)"
    if: github.repository_owner != 'apache'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: "Run ruff check"
        run: >
          uv tool run --from ruff==0.15.10 ruff check
          providers/arenadata/duckdb
          providers/arenadata/ozone

  ruff-check-hbase:
    name: "Ruff check (hbase)"
    if: github.repository_owner != 'apache'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: "Run ruff check"
        run: >
          uv tool run --from ruff==0.15.10 ruff check
          providers/arenadata/hbase
          --exclude providers/arenadata/hbase/src/airflow/providers/arenadata/hbase/hbase_thrift2_generated

  unit-tests:
    name: "Unit tests (${{ matrix.provider }})"
    if: github.repository_owner != 'apache'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: duckdb
            python-version: "3.12"
          - provider: ozone
            python-version: "3.12"
          - provider: hbase
            python-version: "3.12"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: "Run unit tests"
        if: matrix.provider != 'hbase'
        run: >
          uv run --project "providers/arenadata/${{ matrix.provider }}"
          pytest "providers/arenadata/${{ matrix.provider }}/tests/unit"
          -q --color=yes

      # sasl==0.3.1 does not build on CPython 3.12; unit tests mock sasl/thrift_sasl
      - name: "Run unit tests (hbase, skip sasl C-extension)"
        if: matrix.provider == 'hbase'
        run: |
          uv export --project providers/arenadata/hbase \
            --prune sasl --prune thrift-sasl --no-emit-project \
            -o /tmp/hbase-req.txt
          uv venv --python "${{ matrix.python-version }}" /tmp/hbase-venv
          uv pip install --python /tmp/hbase-venv/bin/python -r /tmp/hbase-req.txt
          uv pip install --python /tmp/hbase-venv/bin/python --no-deps \
            -e providers/arenadata/hbase
          /tmp/hbase-venv/bin/pytest providers/arenadata/hbase/tests/unit -q --color=yes
