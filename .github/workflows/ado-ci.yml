---
# Narrow CI for the Arenadata fork on Airflow 2.11. Runs ruff (ozone required, hbase non-blocking)
# and unit tests via uv. Does not use Breeze, GHCR, canary, Helm, or the full Apache test matrix
name: Arenadata CI
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - '*-develop'
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'airflow/providers/arenadata/**'
      - 'tests/providers/arenadata/**'
      - '.github/workflows/ado-ci.yml'
  push:
    branches:
      - '*-develop'
    paths:
      - 'airflow/providers/arenadata/**'
      - 'tests/providers/arenadata/**'
      - '.github/workflows/ado-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ado-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff-check:
    name: "Ruff check (ozone)"
    if: github.repository_owner != 'apache'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: "Run ruff check"
        run: >
          uv tool run --from ruff==0.8.1 ruff check
          airflow/providers/arenadata/ozone

  ruff-check-hbase:
    name: "Ruff check (hbase)"
    if: github.repository_owner != 'apache'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: "Run ruff check"
        run: >
          uv tool run --from ruff==0.8.1 ruff check
          airflow/providers/arenadata/hbase
          --exclude airflow/providers/arenadata/hbase/hbase_thrift2_generated

  unit-tests:
    name: "Unit tests (${{ matrix.provider }})"
    if: github.repository_owner != 'apache'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        provider: [hbase, ozone]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      # Editable Airflow + devel-tests. Do not install extra arenadata-hbase (pulls sasl==0.3.1)
      - name: "Install Airflow and test deps"
        run: |
          uv venv --python 3.12 /tmp/ado-venv
          uv pip install --python /tmp/ado-venv/bin/python -e ".[devel-tests]" thrift

      - name: "Run unit tests"
        env:
          AIRFLOW_HOME: /tmp/airflow-home
        run: >
          /tmp/ado-venv/bin/pytest
          "tests/providers/arenadata/${{ matrix.provider }}"
          -q --color=yes
